name: PANTHERA Regression Suite
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/panthera.html"
      - "site/panthera-manifest.webmanifest"
      - "site/panthera-service-worker.js"
      - "tests/*.test.mjs"
      - "supabase/functions/capture-runtime/index.ts"
      - "supabase/functions/capture-obsidian-pull/index.ts"
      - "supabase/functions/_shared/sovereign.mjs"
      - "supabase/functions/_shared/worker-runtime.mjs"
      - "supabase/functions/panthera-sovereign/index.ts"
      - ".github/workflows/panthera-regression.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install test runtime
        run: npm install --no-audit --no-fund
      - name: Run PANTHERA regression suites
        run: npm test
