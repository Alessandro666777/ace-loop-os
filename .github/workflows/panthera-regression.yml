name: PANTHERA Manual Regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install test runtime
        run: npm install --no-audit --no-fund
      - name: Run 60 user-scenario regression suite
        run: npm test
